[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "arquivabilidade-ja"
version = "0.1.0"
description = "Transparent and reproducible website archivability assessment"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "To be defined before public release"}
dependencies = [
    "PyJWT>=2.15.1,<3",
    "cryptography>=50.0.2,<51",
    "psycopg[binary]>=3.3.6,<4",
    "psycopg-pool>=3.3.3,<4",
]

[project.optional-dependencies]
server = ["uvicorn>=0.54,<0.55"]

[project.scripts]
archivability-worker = "archivability.worker:main"
archivability-worker-health = "archivability.worker:health_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
archivability = [
    "storage/migrations/postgresql/*.sql",
    "storage/migrations/sqlite/*.sql",
]
