[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "arquivabilidade-ja"
version = "0.1.0"
description = "Transparent and reproducible website archivability assessment"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "To be defined before public release"}
dependencies = [
    "PyJWT>=2.15.1,<3",
    "cryptography>=50.0.2,<51",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
archivability = ["storage/migrations/sqlite/*.sql"]
