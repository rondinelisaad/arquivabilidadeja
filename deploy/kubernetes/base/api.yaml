apiVersion: apps/v1
kind: Deployment
metadata:
  name: arquivabilidade-api
  namespace: arquivabilidade-ja
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: arquivabilidade-ja
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arquivabilidade-ja
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: arquivabilidade-runtime
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/rondinelisaad/arquivabilidade-ja:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["uvicorn"]
          args:
            - --factory
            - archivability.asgi:create_app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --no-access-log
          envFrom:
            - configMapRef:
                name: arquivabilidade-config
          env:
            - name: ARCHIVABILITY_DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: arquivabilidade-runtime
                  key: database-dsn
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: temporary
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: arquivabilidade-api
  namespace: arquivabilidade-ja
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: arquivabilidade-ja
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: arquivabilidade-api
  namespace: arquivabilidade-ja
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: arquivabilidade-ja
      app.kubernetes.io/component: api
