name: arquivabilidade-ja

x-runtime-environment: &runtime-environment
  ARCHIVABILITY_ENVIRONMENT: development
  ARCHIVABILITY_DATABASE_DSN: >-
    postgresql://archivability_runtime@/archivability?host=/var/run/postgresql
  ARCHIVABILITY_METHODOLOGY_PATH: /app/methodology/v0.1.0

services:
  database:
    image: postgres:15-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: archivability
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${ARCHIVABILITY_ADMIN_DB_PASSWORD:?set in deploy/compose/.env}
      ARCHIVABILITY_MIGRATION_DB_PASSWORD: ${ARCHIVABILITY_MIGRATION_DB_PASSWORD:?set in deploy/compose/.env}
      ARCHIVABILITY_RUNTIME_DB_PASSWORD: ${ARCHIVABILITY_RUNTIME_DB_PASSWORD:?set in deploy/compose/.env}
      POSTGRES_INITDB_ARGS: --auth-local=trust --auth-host=scram-sha-256
    volumes:
      - database-data:/var/lib/postgresql/data
      - database-socket:/var/run/postgresql
      - ./deploy/compose/init-runtime-role.sh:/docker-entrypoint-initdb.d/10-runtime-role.sh:ro
      - ./deploy/compose/init-runtime-role.sql:/opt/arquivabilidade/init-runtime-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d archivability"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

  migration:
    build:
      context: .
    environment:
      ARCHIVABILITY_MIGRATION_DATABASE_DSN: >-
        postgresql://archivability_migration@/archivability?host=/var/run/postgresql
    command: ["archivability-migrate"]
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - database-socket:/var/run/postgresql
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    restart: "no"

  grants:
    image: postgres:15-bookworm
    environment:
      PGHOST: /var/run/postgresql
      PGDATABASE: archivability
      PGUSER: postgres
    command:
      - psql
      - --set=ON_ERROR_STOP=1
      - --set=runtime_role=archivability_runtime
      - --set=migration_role=archivability_migration
      - --set=database_name=archivability
      - --file=/grants/runtime_grants.sql
    depends_on:
      migration:
        condition: service_completed_successfully
    volumes:
      - database-socket:/var/run/postgresql
      - ./deploy/postgresql/runtime_grants.sql:/grants/runtime_grants.sql:ro
    read_only: true
    tmpfs:
      - /tmp:size=8m,noexec,nosuid,nodev
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    restart: "no"

  api:
    build:
      context: .
    restart: unless-stopped
    environment:
      <<: *runtime-environment
      ARCHIVABILITY_OIDC_ISSUER: ${ARCHIVABILITY_OIDC_ISSUER:?set in deploy/compose/.env}
      ARCHIVABILITY_OIDC_AUDIENCE: ${ARCHIVABILITY_OIDC_AUDIENCE:?set in deploy/compose/.env}
      ARCHIVABILITY_OIDC_JWKS_URI: ${ARCHIVABILITY_OIDC_JWKS_URI:?set in deploy/compose/.env}
    depends_on:
      grants:
        condition: service_completed_successfully
    volumes:
      - database-socket:/var/run/postgresql
    ports:
      - "127.0.0.1:${ARCHIVABILITY_HTTP_PORT:-8080}:8000"
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12

  browser:
    build:
      context: browser-sidecar
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=512m,nosuid,nodev
    shm_size: 256m
    cap_drop: ["ALL"]
    cap_add: ["SYS_CHROOT"]
    security_opt:
      - no-new-privileges:true
      - seccomp:deploy/compose/chromium-seccomp.json

  worker:
    build:
      context: .
    command: ["archivability-worker"]
    restart: unless-stopped
    network_mode: "service:browser"
    environment:
      <<: *runtime-environment
      ARCHIVABILITY_WORKER_ID: worker-local-1
      ARCHIVABILITY_PROBE_ID: ${ARCHIVABILITY_PROBE_ID:-probe-local}
      ARCHIVABILITY_PROBE_COUNTRY: ${ARCHIVABILITY_PROBE_COUNTRY:-unknown}
      ARCHIVABILITY_PROBE_REGION: ${ARCHIVABILITY_PROBE_REGION:-unknown}
      ARCHIVABILITY_BROWSER_RENDERER_ENDPOINT: http://127.0.0.1:9223/render
    depends_on:
      grants:
        condition: service_completed_successfully
      browser:
        condition: service_started
    volumes:
      - database-socket:/var/run/postgresql
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 6m

volumes:
  database-data:
  database-socket:
